name: 🐛 Bug Report
description: Create a report to help us reproduce and fix a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check existing issues first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console or Terminal Logs
      description: Paste any relevant console or terminal error messages.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Operating System, Node version (`node -v`), pnpm version (`pnpm -v`), Browser.
      placeholder: e.g. macOS Sonoma, Node v20.15.0, pnpm 10.4.1, Chrome 125
    validations:
      required: false
