<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a090e" />
      <stop offset="50%" stop-color="#0e0c15" />
      <stop offset="100%" stop-color="#14111f" />
    </linearGradient>

    <!-- Brand Color Gradient -->
    <linearGradient id="brand-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />   <!-- brand-violet -->
      <stop offset="50%" stop-color="#4f46e5" />  <!-- brand-indigo -->
      <stop offset="100%" stop-color="#06b6d4" /> <!-- brand-cyan -->
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="bolt-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Spark Gradient -->
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#border-grad)" stroke-width="6" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="360" r="140" fill="#7c3aed" opacity="0.15" filter="url(#glow)" />
  <circle cx="395" cy="130" r="100" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />

  <!-- Dynamic Rings (Orbits of Engagement) -->
  <circle cx="256" cy="360" r="72" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="16 12" opacity="0.25" />
  <circle cx="198" cy="260" r="54" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 8" opacity="0.25" />

  <!-- Thread Connection Line -->
  <path d="M 140,160 L 256,360" stroke="url(#brand-gradient)" stroke-width="18" stroke-linecap="round" filter="url(#soft-glow)" opacity="0.5" />
  <path d="M 140,160 L 256,360" stroke="url(#brand-gradient)" stroke-width="12" stroke-linecap="round" />

  <!-- Thread Nodes -->
  <circle cx="256" cy="360" r="32" fill="url(#brand-gradient)" />
  <circle cx="256" cy="360" r="32" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4" />

  <circle cx="198" cy="260" r="24" fill="url(#brand-gradient)" />
  <circle cx="198" cy="260" r="24" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.4" />

  <circle cx="140" cy="160" r="16" fill="url(#brand-gradient)" />
  <circle cx="140" cy="160" r="16" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" />

  <!-- Lightning Bolt -->
  <polygon points="256,360 330,265 305,265 395,130 325,225 350,225" fill="url(#bolt-grad)" filter="url(#glow)" opacity="0.6" />
  <polygon points="256,360 330,265 305,265 395,130 325,225 350,225" fill="url(#bolt-grad)" />

  <!-- Sparks -->
  <path d="M 405,100 Q 405,120 425,120 Q 405,120 405,140 Q 405,120 385,120 Q 405,120 405,100 Z" fill="url(#spark-grad)" filter="url(#soft-glow)" />
  <path d="M 405,100 Q 405,120 425,120 Q 405,120 405,140 Q 405,120 385,120 Q 405,120 405,100 Z" fill="#ffffff" />

  <path d="M 115,105 Q 115,115 125,115 Q 115,115 115,125 Q 115,115 105,115 Q 115,115 115,105 Z" fill="#a5f3fc" opacity="0.8" />
  <path d="M 370,295 Q 370,302 377,302 Q 370,302 370,309 Q 370,302 363,302 Q 370,302 370,295 Z" fill="#7c3aed" opacity="0.7" />
</svg>
